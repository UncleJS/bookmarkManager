# Containerised test suite: API integration tests (with backup/restore check)
# and the Playwright E2E suite, each in a throwaway rootless Podman pod.
name: tests

on:
  push:
    branches: [development, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      JOB: ci
    steps:
      - uses: actions/checkout@v4

      - name: Podman version
        run: podman version

      - name: Integration tests
        run: scripts/test-integration.sh

      - name: E2E tests
        run: scripts/test-e2e.sh

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          if-no-files-found: ignore
          retention-days: 14

      - name: Clean up
        if: always()
        run: scripts/uninstall.sh --purge --remove-quadlets || true
