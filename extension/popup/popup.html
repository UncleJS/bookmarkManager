<!doctype html>
<html class="dark" lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Add Bookmark</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body class="dark-bg dark-text">
  <main class="main-container">
    <div id="save-toast" class="save-toast" role="status" aria-live="polite" aria-atomic="true"></div>

    <div class="header">
      <h1 class="title">Add Bookmark</h1>
    </div>

    <form id="form" class="form-container">
      <!-- URL Field -->
      <div class="field-group">
        <label for="url" class="field-label">URL</label>
        <input
          id="url"
          name="url"
          type="text"
          readonly
          class="input-field input-readonly"
        />
      </div>

      <!-- Title Field -->
      <div class="field-group">
        <label for="title" class="field-label">Title</label>
        <input
          id="title"
          name="title"
          type="text"
          class="input-field"
        />
      </div>

      <!-- Description Field -->
      <div class="field-group">
        <label for="description" class="field-label">Description</label>
        <textarea
          id="description"
          name="description"
          rows="3"
          class="input-field textarea-field"
        ></textarea>
      </div>

      <!-- Sub-categories -->
      <div class="field-group">
        <label for="subcategory-search" class="field-label">Sub-categories</label>
        <div class="input-group">
          <!-- Search input for subcategories -->
          <div class="relative">
            <input
              id="subcategory-search"
              type="text"
              placeholder="Search sub-categories"
              autocomplete="off"
              aria-autocomplete="list"
              aria-expanded="false"
              aria-controls="subcategory-suggestions"
              class="input-field"
            />

            <!-- Sub-category suggestions dropdown - moved inside relative container -->
            <div id="subcategory-suggestions" class="dropdown hidden" role="listbox" aria-label="Sub-category suggestions"></div>
          </div>

          <!-- Selected subcategories -->
          <div id="selected-subcategories" class="chips-container"></div>

          <!-- Add new subcategory -->
          <button
            id="add-subcategory"
            type="button"
            class="add-button"
          >
            + Add sub-category
          </button>
        </div>
      </div>

      <!-- Tags -->
      <div class="field-group">
        <label for="tag-input" class="field-label">Tags</label>
        <div class="input-group">
          <!-- Selected tags -->
          <div id="selected-tags" class="chips-container"></div>

          <!-- Tag input with suggestions -->
          <div class="relative">
            <input
              id="tag-input"
              type="text"
              placeholder="Search or add tags"
              autocomplete="off"
              aria-autocomplete="list"
              aria-expanded="false"
              aria-controls="tag-suggestions"
              class="input-field"
            />
            <ul id="tag-suggestions" class="dropdown-suggestions hidden" role="listbox" aria-label="Tag suggestions"></ul>
          </div>
        </div>
      </div>

      <!-- Flags -->
      <div class="field-group">
        <fieldset class="flags-fieldset">
          <legend class="flags-legend">Flags</legend>
          <div class="flags-grid">
            <label class="flag-label">
              <input type="checkbox" id="flag-forReview" class="flag-checkbox" />
              <span>For review</span>
            </label>
            <label class="flag-label">
              <input type="checkbox" id="flag-readLater" class="flag-checkbox" />
              <span>Read later</span>
            </label>
            <label class="flag-label">
              <input type="checkbox" id="flag-hotTopic" class="flag-checkbox" />
              <span>Hot topic</span>
            </label>
            <label class="flag-label">
              <input type="checkbox" id="flag-cheatsheets" class="flag-checkbox" />
              <span>Cheatsheets</span>
            </label>
            <label class="flag-label flag-full">
              <input type="checkbox" id="flag-archived" class="flag-checkbox" />
              <span>Archived</span>
            </label>
          </div>
        </fieldset>
      </div>

      <!-- Duplicate warning -->
      <div id="duplicate-warning" class="duplicate-warning hidden" role="alert" aria-live="assertive" aria-atomic="true" tabindex="-1">
        <div class="duplicate-warning-text">
          <h2>Possible duplicate</h2>
          <p>This URL already exists in your bookmarks. Review the existing entries below.</p>
        </div>
        <ul id="duplicate-list" class="duplicate-list"></ul>
        <div class="duplicate-actions">
          <button type="button" id="duplicate-cancel" class="secondary-button">Cancel</button>
          <button type="button" id="duplicate-confirm" class="save-button duplicate-confirm">Close</button>
        </div>
      </div>

      <!-- Actions -->
      <div class="actions-container">
        <span id="status" class="status-text" role="status" aria-live="polite" aria-atomic="true"></span>
        <button
          id="save"
          type="submit"
          class="save-button"
        >
          Save bookmark
        </button>
      </div>
    </form>
  </main>

  <!-- Modal for creating subcategories -->
  <div id="subcategory-modal" class="modal-backdrop hidden">
    <div class="modal-content" role="dialog" aria-modal="true" aria-labelledby="subcategory-modal-title" tabindex="-1">
      <h3 id="subcategory-modal-title" class="modal-title">Create taxonomy item</h3>

      <div class="modal-body">
        <div class="field-group">
          <label for="modal-subcategory-name" id="modal-name-label" class="field-label">Sub-category Name</label>
          <input
            id="modal-subcategory-name"
            type="text"
            placeholder="Enter a sub-category name"
            class="input-field"
          />
        </div>

        <div class="field-group">
          <label class="field-label">Level</label>
          <div class="radio-group">
            <label class="radio-label">
              <input type="radio" name="level-option" value="subcategory" checked class="radio-input" />
              <span>Sub-category</span>
            </label>
            <label class="radio-label">
              <input type="radio" name="level-option" value="subSubcategory" class="radio-input" />
              <span>Sub-sub-category</span>
            </label>
          </div>
        </div>

        <div id="parent-subcategory-section" class="field-group hidden">
          <label for="modal-parent-subcategory" class="field-label">Parent sub-category</label>
          <select id="modal-parent-subcategory" class="input-field"></select>
        </div>

        <div class="field-group">
          <label for="modal-subcategory-description" class="field-label">Description <span style="font-weight:400;opacity:0.65">(optional)</span></label>
          <textarea
            id="modal-subcategory-description"
            placeholder="Optional description"
            class="input-field textarea-field"
            rows="2"
          ></textarea>
        </div>

        <div class="field-group">
          <label class="field-label">Category</label>
          <div class="radio-group">
            <label class="radio-label">
              <input type="radio" name="category-option" value="none" checked class="radio-input" />
              <span>No category</span>
            </label>
            <label class="radio-label">
              <input type="radio" name="category-option" value="existing" class="radio-input" />
              <span>Existing category</span>
            </label>
            <label class="radio-label">
              <input type="radio" name="category-option" value="new" class="radio-input" />
              <span>New category</span>
            </label>
          </div>
        </div>

        <div id="existing-categories-section" class="field-group hidden">
          <label for="modal-existing-categories" class="field-label">Choose category</label>
          <select
            id="modal-existing-categories"
            class="input-field"
          >
          </select>
        </div>

        <div id="new-category-section" class="field-group hidden">
          <label for="modal-new-category-name" class="field-label">New category name</label>
          <input
            id="modal-new-category-name"
            type="text"
            placeholder="Enter a category name"
            class="input-field"
          />
        </div>
      </div>

      <div class="modal-actions">
        <button
          id="modal-cancel"
          type="button"
          class="cancel-button"
        >
          Cancel
        </button>
        <button
          id="modal-create"
          type="button"
          class="create-button"
        >
          Create
        </button>
      </div>
    </div>
  </div>

  <script type="module" src="popup.js"></script>
  <footer style="position:fixed;bottom:0;left:0;right:0;text-align:center;padding:0.25rem 0;color:#ffffff;font-size:0.6rem;background:#111827;border-top:1px solid #374151;z-index:50;">
    © 2026 Jaco Steyn — Licensed under CC BY-SA 4.0
  </footer>
</body>
</html>
