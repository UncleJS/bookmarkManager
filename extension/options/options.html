<!doctype html>
<html class="dark" lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bookmark Manager Options</title>
  <link rel="stylesheet" href="options.css" />
</head>
<body class="options-page">
  <main class="options-layout">
    <section class="options-card" aria-labelledby="options-title">
      <header class="options-header">
        <p class="eyebrow">Extension Settings</p>
        <h1 id="options-title">Bookmark Manager Options</h1>
        <p class="options-copy">Configure the API endpoint used by the extension when saving bookmarks.</p>
      </header>

      <div class="field-group">
        <label for="apiBaseUrl" class="field-label">API Base URL</label>
        <input id="apiBaseUrl" class="input-field" type="url" inputmode="url" placeholder="http://localhost:11650" title="Enter a full http:// or https:// URL" aria-describedby="apiBaseUrlHint" />
        <p id="apiBaseUrlHint" class="field-hint">Use the full base URL for your local or hosted Bookmark Manager API.</p>
      </div>

      <div class="actions-row">
        <span id="status" class="status-text" role="status" aria-live="polite"></span>
        <button id="save" class="save-button">Save</button>
      </div>
    </section>
  </main>

  <script type="module" src="options.js"></script>
  <footer class="page-footer">
    © 2026 Jaco Steyn — Licensed under CC BY-SA 4.0
  </footer>
</body>
</html>
