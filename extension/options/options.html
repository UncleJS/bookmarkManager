<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bookmark Manager Options</title>
  <style>
    body { font-family: system-ui, sans-serif; padding: 16px; }
    label { display: block; margin: 8px 0; }
    input[type="url"] { width: 420px; max-width: 100%; padding: 6px; }
    button { padding: 6px 10px; }
    #status { margin-left: 8px; font-size: 12px; color: #4b5563; }
    #status[data-state="success"] { color: #166534; }
    #status[data-state="error"] { color: #b91c1c; }
  </style>
</head>
<body>
  <h1>Options</h1>
  <label>
    API Base URL
    <input id="apiBaseUrl" type="url" inputmode="url" placeholder="http://localhost:11650" title="Enter a full http:// or https:// URL" />
  </label>
  <button id="save">Save</button>
  <span id="status"></span>

  <script type="module" src="options.js"></script>
  <footer style="position:fixed;bottom:0;left:0;right:0;text-align:center;padding:0.25rem 0;color:#ffffff;font-size:0.65rem;background:#fff;border-top:1px solid #e5e7eb;z-index:50;">
    © 2026 Jaco Steyn — Licensed under CC BY-SA 4.0
  </footer>
</body>
</html>
