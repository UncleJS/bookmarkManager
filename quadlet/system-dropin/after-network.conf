# =============================================================================
# System-level drop-in: delay user@1000 session until network is fully up
#
# Install to: /etc/systemd/system/user@1000.service.d/after-network.conf
#
# Why this is needed:
#   Rootless Podman + Quadlet units start as soon as the user@UID session
#   starts (via loginctl linger). Without this, the user session can start
#   before the host network stack is ready, causing pasta (the user-mode
#   network backend) to fail with:
#     "Couldn't get any nameserver address"
#     "Couldn't set IPv4 route(s) in guest: Invalid argument"
#   The pod then retries on-failure and eventually comes up, but it takes
#   several minutes and causes unnecessary failures on every boot.
#
# What this does:
#   Orders user@1000.service After=network-online.target so the user session
#   (and all Quadlet units within it) only starts once NetworkManager has
#   confirmed all connections are up.
#
# Prerequisites (run once as root):
#   sudo systemctl enable NetworkManager-wait-online.service
#   sudo mkdir -p /etc/systemd/system/user@1000.service.d
#   sudo cp after-network.conf /etc/systemd/system/user@1000.service.d/
#   sudo systemctl daemon-reload
# =============================================================================

[Unit]
After=network-online.target
Wants=network-online.target
