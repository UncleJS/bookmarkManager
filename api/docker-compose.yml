version: '3.8'
services:
  db:
    image: mariadb:11
    container_name: bm_db_dev
    environment:
      MARIADB_ROOT_PASSWORD: example
      MARIADB_DATABASE: bookmarks
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  db_data:
