<!DOCTYPE html>

<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bookmark Manager</title>
  <script src="/ui/theme-init.js"></script>
  <link rel="stylesheet" href="/ui/theme.css" />
  <link rel="stylesheet" href="/ui/app.css" />
</head>
<body>
<div id="layout">

  <!-- ── Sidebar ──────────────────────────────────────────────────────────── -->
  <aside id="sidebar">
    <div id="sidebar-header">
      <h1>🔖 Bookmarks</h1>
      <p id="sidebar-subtitle">Loading…</p>
    </div>
    <nav id="sidebar-nav">
      <button class="nav-item active" data-id="" data-action="selectAll">
        <span class="nav-item-label">All bookmarks</span>
      </button>
    </nav>
  </aside>

  <!-- ── Main ─────────────────────────────────────────────────────────────── -->
  <div id="main">

    <div id="topbar">
      <span id="topbar-title">All bookmarks</span>
      <span id="topbar-count"></span>
      <div id="search-wrap">
        <input type="text" id="search-q" placeholder="Search title, URL, description…" autocomplete="off" />
        <button id="search-clear" data-action="clearSearch" title="Clear search" tabindex="-1">×</button>
      </div>
      <a href="/manage-categories" class="nav-btn">⚙ Categories</a>
      <a href="/manage-tags" class="nav-btn"># Tags</a>
      <button class="nav-btn" data-action="triggerBackup">⬇ Backup</button>
      <button type="button" class="theme-toggle" data-theme-toggle title="Switch to the light theme" aria-label="Switch to the light theme">☀</button>
      <button class="nav-btn" data-action="logout" title="End this browser session">⏻ Log out</button>
      <div id="archive-toggle">
        <button class="toggle-btn active" id="btn-active"   data-action="setArchived" data-arg="false">Active</button>
        <button class="toggle-btn"        id="btn-archived" data-action="setArchived" data-arg="true">Archived</button>
      </div>
      <button class="sort-btn active" id="btn-newest" data-action="setSort" data-arg="newest">↓ Newest</button>
      <button class="sort-btn"        id="btn-oldest" data-action="setSort" data-arg="oldest">↑ Oldest</button>
    </div>

    <div id="content">
      <div class="state-box"><div class="icon">⏳</div>Loading…</div>
    </div>

    <footer class="license-footer">
      <span>© 2026 UncleJS — Licensed under <a href="https://www.gnu.org/licenses/agpl-3.0.txt" target="_blank" rel="noopener noreferrer">AGPL-3.0-or-later</a></span>
    </footer>

    <div id="pagination">
      <button class="page-btn" id="btn-prev" data-action="changePage" data-arg="-1">← Prev</button>
      <span id="page-info"></span>
      <button class="page-btn" id="btn-next" data-action="changePage" data-arg="1">Next →</button>
    </div>

  </div>
</div>

<!-- ── Edit modal ─────────────────────────────────────────────────────────── -->
<div id="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="modal-title">
  <div id="modal">
    <h2 id="modal-title">Edit Bookmark</h2>

    <div class="modal-field">
      <label>Title</label>
      <input type="text" id="edit-title" />
    </div>

    <div class="modal-field">
      <label>URL</label>
      <input type="text" id="edit-url" />
    </div>

    <div class="modal-field">
      <label>Description</label>
      <textarea id="edit-description" rows="3"></textarea>
    </div>

    <div class="modal-field">
      <label>Flags</label>
      <div class="flag-toggles">
        <label class="flag-toggle"><input type="checkbox" id="flag-readLater" /> Read Later</label>
        <label class="flag-toggle"><input type="checkbox" id="flag-hotTopic" /> Hot Topic</label>
        <label class="flag-toggle"><input type="checkbox" id="flag-cheatsheets" /> Cheatsheet</label>
        <label class="flag-toggle"><input type="checkbox" id="flag-forReview" /> For Review</label>
      </div>
    </div>

    <div class="modal-field">
      <label>Sub-categories</label>
      <div class="taxonomy-selected-list" id="selected-taxonomy"></div>
      <div class="taxonomy-selection-grid">
        <select id="taxonomy-category-select" class="taxonomy-select" data-change="onTaxonomyCategoryChange">
          <option value="">Select category</option>
        </select>
        <select id="taxonomy-subcategory-select" class="taxonomy-select" data-change="onTaxonomySubcategoryChange" disabled>
          <option value="">Select sub-category</option>
        </select>
        <select id="taxonomy-subsubcategory-select" class="taxonomy-select" data-change="onTaxonomySubSubcategoryChange" disabled>
          <option value="">Select sub-sub-category (optional)</option>
        </select>
      </div>
      <div class="taxonomy-add-row">
        <button type="button" class="btn-primary" id="taxonomy-add-btn" data-action="addSelectedTaxonomy" disabled>Add selection</button>
      </div>
      <div class="taxonomy-helper">Add a category only, or continue into a sub-category and optional sub-sub-category.</div>
      <button type="button" class="btn-add-new-class" data-action="openCreateSubcategoryModal">+ Add New Sub-category</button>
    </div>

    <div class="modal-field">
      <label>Tags</label>
      <input type="text" class="picker-search" id="tag-search" placeholder="Filter or create new tag…" data-input="filterChips" data-arg="tag" />
      <div class="picker-list" id="tag-chips"></div>
    </div>

    <div class="modal-actions">
      <button class="btn-cancel" data-action="closeModal">Cancel</button>
      <button class="btn-primary" id="modal-save" data-action="saveEdit">Save</button>
    </div>
  </div>
</div>

<!-- ── Create sub-category sub-modal ─────────────────────────────────── -->
<div id="create-class-overlay" role="dialog" aria-modal="true" aria-labelledby="create-class-title">
  <div id="create-class-modal">
    <h3 id="create-class-title">New Sub-category</h3>

    <div class="create-class-field">
      <label for="cc-name">Name</label>
      <input type="text" id="cc-name" placeholder="e.g. TypeScript" autocomplete="off" />
    </div>

    <div class="create-class-field">
      <label for="cc-description">Description <span class="label-optional">(optional)</span></label>
      <textarea id="cc-description" rows="2" placeholder="Short description of this sub-category..." class="cc-textarea"></textarea>
    </div>

    <div class="create-class-field">
      <label>Category</label>
      <div class="create-class-radios">
        <label class="create-class-radio-label">
          <input type="radio" name="cc-category-option" value="none" checked data-change="updateCCCategorySections" />
          No category
        </label>
        <label class="create-class-radio-label" id="cc-existing-radio-label">
          <input type="radio" name="cc-category-option" value="existing" data-change="updateCCCategorySections" />
          Existing category
        </label>
        <label class="create-class-radio-label">
          <input type="radio" name="cc-category-option" value="new" data-change="updateCCCategorySections" />
          New category
        </label>
      </div>
    </div>

    <div class="create-class-field" id="cc-existing-section" hidden>
      <label for="cc-existing-select">Select category</label>
      <select id="cc-existing-select">
        <option value="">— choose —</option>
      </select>
    </div>

    <div class="create-class-field" id="cc-new-section" hidden>
      <label for="cc-new-category-name">New category name</label>
      <input type="text" id="cc-new-category-name" placeholder="e.g. Languages" autocomplete="off" />
    </div>

    <div id="create-class-error"></div>

    <div class="modal-actions">
      <button class="btn-cancel" data-action="closeCreateClassModal">Cancel</button>
      <button class="btn-primary" id="cc-create-btn" data-action="handleCreateSubcategory">Create</button>
    </div>
  </div>
</div>

<script src="/ui/datetime.js"></script>
<script src="/ui/common.js"></script>
<script src="/ui/app.js"></script>
</body>
</html>
