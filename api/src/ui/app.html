<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bookmark Manager</title>
  <style>
    /* ── Reset & base ────────────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #0a0a0a;
      --surface:   #111111;
      --surface2:  #1a1a1a;
      --border:    #2a2a2a;
      --border2:   #333333;
      --text:      #f0f0f0;
      --text-muted:#ffffff;
      --accent:    #4f9cf9;
      --accent-dim:#1d3d6b;
      --tag-bg:    #1e2a3a;
      --tag-text:  #7fb8f8;
      --flag-read: #4ade80;
      --flag-hot:  #f97316;
      --flag-cs:   #a78bfa;
      --flag-rev:  #facc15;
      --danger:    #ef4444;
      --sidebar-w: 260px;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: ui-monospace, 'Cascadia Code', 'Fira Code', monospace;
      font-size: 14px;
      line-height: 1.5;
    }

    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }

    /* ── Layout ──────────────────────────────────────────────────────────── */
    #layout {
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    /* ── Sidebar ─────────────────────────────────────────────────────────── */
    #sidebar {
      width: var(--sidebar-w);
      flex-shrink: 0;
      background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    #sidebar-header {
      padding: 16px 14px 12px;
      border-bottom: 1px solid var(--border);
    }

    #sidebar-header h1 {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.05em;
      color: var(--text);
    }

    #sidebar-header p {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    #sidebar-nav {
      flex: 1;
      overflow-y: auto;
      padding: 8px 0;
    }

    .nav-section-label {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-muted);
      padding: 8px 14px 3px;
      margin-top: 4px;
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .nav-section-label::before {
      content: '';
      display: inline-block;
      width: 3px;
      height: 10px;
      background: var(--border2);
      border-radius: 2px;
      flex-shrink: 0;
    }

    /* indent category items under their group label */
    .nav-item.cat-item {
      padding-left: 24px;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 6px;
      width: 100%;
      text-align: left;
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-family: inherit;
      font-size: 13px;
      padding: 6px 14px;
      border-radius: 0;
      transition: background 0.1s, color 0.1s;
      overflow: hidden;
    }

    .nav-item-label {
      flex: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .nav-item-count {
      font-size: 10px;
      font-weight: 600;
      color: var(--text);
      background: var(--surface2);
      border-radius: 8px;
      padding: 1px 6px;
      flex-shrink: 0;
      min-width: 18px;
      text-align: center;
    }

    .nav-item:hover {
      background: var(--surface2);
      color: var(--text);
    }

    .nav-item.active {
      background: #1a2e1a;
      color: #6ee76e;
      font-weight: 600;
    }

    .nav-item.active .nav-item-count {
      background: #1f3d1f;
      color: var(--text);
    }

    .nav-group-heading {
      font-size: 10px;
      font-weight: 700;
      color: var(--accent);
      background: var(--accent-dim);
      padding: 5px 8px 5px 14px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      margin-top: 6px;
      border-left: 3px solid var(--accent);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .nav-group-heading-label {
      flex: 1;
    }

    .tag-sort-toggle {
      display: flex;
      gap: 2px;
      flex-shrink: 0;
    }

    .tag-sort-btn {
      font-size: 9px;
      font-family: inherit;
      font-weight: 600;
      letter-spacing: 0.05em;
      padding: 1px 5px;
      border-radius: 3px;
      border: 1px solid transparent;
      cursor: pointer;
      background: none;
      color: var(--accent);
      opacity: 0.5;
      transition: opacity 0.1s, background 0.1s, border-color 0.1s;
      text-transform: uppercase;
    }

    .tag-sort-btn:hover { opacity: 0.8; }

    .tag-sort-btn.active {
      opacity: 1;
      background: var(--bg);
      border-color: var(--accent);
    }

    /* flag filter items */
    .nav-item.flag-read.active  { background:#0d2b19; color:var(--flag-read); }
    .nav-item.flag-hot.active   { background:#2b1400; color:var(--flag-hot);  }
    .nav-item.flag-cs.active    { background:#1e1330; color:var(--flag-cs);   }
    .nav-item.flag-rev.active   { background:#2b2200; color:var(--flag-rev);  }
    .nav-item.flag-dot::before {
      content: '●';
      font-size: 8px;
      flex-shrink: 0;
    }
    .nav-item.flag-read::before { color: var(--flag-read); }
    .nav-item.flag-hot::before  { color: var(--flag-hot);  }
    .nav-item.flag-cs::before   { color: var(--flag-cs);   }
    .nav-item.flag-rev::before  { color: var(--flag-rev);  }

    /* ── Main ────────────────────────────────────────────────────────────── */
    #main {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    #topbar {
      padding: 12px 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--surface);
      flex-shrink: 0;
    }

    #topbar-title {
      font-size: 14px;
      font-weight: 600;
      color: var(--text);
      flex: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    #topbar-count {
      font-size: 12px;
      color: var(--text-muted);
      white-space: nowrap;
    }

    .sort-btn {
      background: var(--surface2);
      border: 1px solid var(--border2);
      color: var(--text-muted);
      font-family: inherit;
      font-size: 12px;
      padding: 4px 10px;
      border-radius: 4px;
      cursor: pointer;
      transition: border-color 0.1s, color 0.1s;
    }

    .sort-btn:hover, .sort-btn.active {
      border-color: var(--accent);
      color: var(--accent);
    }

    .nav-btn {
      background: var(--surface2);
      border: 1px solid var(--border2);
      color: var(--text-muted);
      font-family: inherit;
      font-size: 12px;
      padding: 4px 10px;
      border-radius: 4px;
      cursor: pointer;
      white-space: nowrap;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      transition: border-color 0.1s, color 0.1s, background 0.1s;
    }

    .nav-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
      text-decoration: none;
    }

    /* ── Content ─────────────────────────────────────────────────────────── */
    #content {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 16px 20px;
    }

    /* ── Bookmark card ───────────────────────────────────────────────────── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 14px 16px;
      margin-bottom: 10px;
      transition: border-color 0.15s;
    }

    .card:hover {
      border-color: var(--border2);
    }

    .card-title-row {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      margin-bottom: 4px;
    }

    .card-favicon {
      width: 16px;
      height: 16px;
      margin-top: 2px;
      flex-shrink: 0;
      border-radius: 2px;
    }

    .card-title {
      font-size: 14px;
      font-weight: 600;
      color: var(--text);
      flex: 1;
      line-height: 1.4;
    }

    .card-title a {
      color: var(--text);
    }

    .card-title a:hover {
      color: var(--accent);
      text-decoration: none;
    }

    .card-url {
      font-size: 11px;
      color: var(--text-muted);
      margin-bottom: 6px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .card-description {
      font-size: 13px;
      color: #ffffff;
      margin-bottom: 8px;
      line-height: 1.5;
    }

    .card-meta {
      display: flex;
      flex-direction: column;
      gap: 5px;
      margin-top: 8px;
    }

    .card-meta-row {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .card-meta-label {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-muted);
      flex-shrink: 0;
      width: 80px;
    }

    .card-meta-date {
      font-size: 11px;
      color: var(--text-muted);
      margin-left: auto;
      white-space: nowrap;
    }

    .tag {
      font-size: 11px;
      background: var(--tag-bg);
      color: var(--tag-text);
      border-radius: 3px;
      padding: 2px 7px;
    }

    .classification-badge {
      font-size: 11px;
      background: #1a2a1a;
      color: #6ee06e;
      border-radius: 3px;
      padding: 2px 7px;
    }

    .classification-group {
      font-size: 10px;
      opacity: 0.7;
      margin-right: 2px;
    }

    /* ── Edit button on cards ─────────────────────────────────────────────── */
    .btn-edit {
      background: none;
      border: 1px solid var(--border2);
      color: var(--text-muted);
      font-family: inherit;
      font-size: 11px;
      padding: 3px 10px;
      border-radius: 4px;
      cursor: pointer;
      transition: border-color 0.1s, color 0.1s;
      margin-right: 6px;
    }
    .btn-edit:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    /* ── Edit modal ──────────────────────────────────────────────────────── */
    #modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      z-index: 100;
      align-items: center;
      justify-content: center;
    }
    #modal-overlay.open { display: flex; }

    #modal {
      background: var(--surface);
      border: 1px solid var(--border2);
      border-radius: 8px;
      width: 800px;
      max-width: 96vw;
      max-height: 92vh;
      overflow-y: auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    #modal h2 {
      font-size: 14px;
      font-weight: 700;
      color: var(--text);
      margin: 0;
    }

    .modal-field label {
      display: block;
      font-size: 11px;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.07em;
      margin-bottom: 5px;
    }

    .modal-field input[type="text"],
    .modal-field textarea {
      width: 100%;
      background: var(--surface2);
      border: 1px solid var(--border2);
      border-radius: 4px;
      color: var(--text);
      font-family: inherit;
      font-size: 13px;
      padding: 7px 10px;
      outline: none;
      resize: vertical;
    }
    .modal-field input[type="text"]:focus,
    .modal-field textarea:focus {
      border-color: var(--accent);
    }

    .flag-toggles {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .flag-toggle {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: var(--text-muted);
      cursor: pointer;
      user-select: none;
    }
    .flag-toggle input { accent-color: var(--accent); cursor: pointer; }

    /* tag/classification picker */
    .picker-search {
      width: 100%;
      background: var(--surface2);
      border: 1px solid var(--border2);
      border-radius: 4px;
      color: var(--text);
      font-family: inherit;
      font-size: 12px;
      padding: 5px 8px;
      outline: none;
      margin-bottom: 6px;
    }
    .picker-search:focus { border-color: var(--accent); }

    .picker-list {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      max-height: 400px;
      overflow-y: auto;
    }

    .picker-chip {
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 3px;
      cursor: pointer;
      border: 1px solid var(--border2);
      background: var(--surface2);
      color: var(--text-muted);
      transition: background 0.1s, color 0.1s, border-color 0.1s;
      white-space: nowrap;
    }
    .picker-chip.selected {
      background: var(--accent-dim);
      border-color: var(--accent);
      color: var(--accent);
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
    }

    .btn-primary {
      background: var(--accent-dim);
      border: 1px solid var(--accent);
      color: var(--accent);
      font-family: inherit;
      font-size: 12px;
      font-weight: 600;
      padding: 6px 18px;
      border-radius: 4px;
      cursor: pointer;
    }
    .btn-primary:hover { background: #254d8a; }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }

    .btn-cancel {
      background: none;
      border: 1px solid var(--border2);
      color: var(--text-muted);
      font-family: inherit;
      font-size: 12px;
      padding: 6px 18px;
      border-radius: 4px;
      cursor: pointer;
    }
    .btn-cancel:hover { border-color: var(--text-muted); color: var(--text); }

    /* ── Create-classification sub-modal ─────────────────────────────────── */
    #create-class-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      z-index: 200;
      align-items: center;
      justify-content: center;
    }
    #create-class-overlay.open { display: flex; }

    #create-class-modal {
      background: var(--surface);
      border: 1px solid var(--border2);
      border-radius: 8px;
      width: 400px;
      max-width: 94vw;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    #create-class-modal h3 {
      font-size: 13px;
      font-weight: 700;
      color: var(--text);
      margin: 0;
    }

    .create-class-field { display: flex; flex-direction: column; gap: 5px; }
    .create-class-field label {
      font-size: 11px;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.07em;
    }
    .create-class-field input[type="text"],
    .create-class-field select {
      width: 100%;
      background: var(--surface2);
      border: 1px solid var(--border2);
      border-radius: 4px;
      color: var(--text);
      font-family: inherit;
      font-size: 13px;
      padding: 6px 9px;
      outline: none;
    }
    .create-class-field input[type="text"]:focus,
    .create-class-field select:focus { border-color: var(--accent); }
    .create-class-field select option { background: var(--surface2); }

    .create-class-radios { display: flex; flex-direction: column; gap: 6px; }
    .create-class-radio-label {
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 12px;
      color: var(--text-muted);
      cursor: pointer;
      user-select: none;
    }
    .create-class-radio-label input { accent-color: var(--accent); cursor: pointer; }

    #create-class-error {
      font-size: 11px;
      color: var(--danger);
      min-height: 16px;
    }

    .btn-add-new-class {
      align-self: flex-start;
      background: none;
      border: 1px dashed var(--border2);
      color: var(--text-muted);
      font-family: inherit;
      font-size: 11px;
      padding: 3px 10px;
      border-radius: 4px;
      cursor: pointer;
      margin-top: 2px;
    }
    .btn-add-new-class:hover { border-color: var(--accent); color: var(--accent); }

    .flag {
      font-size: 10px;
      font-weight: 700;
      border-radius: 3px;
      padding: 2px 7px;
      letter-spacing: 0.04em;
    }

    .flag-read   { background: #0d2b19; color: var(--flag-read); }
    .flag-hot    { background: #2b1400; color: var(--flag-hot);  }
    .flag-cs     { background: #1e1330; color: var(--flag-cs);   }
    .flag-rev    { background: #2b2200; color: var(--flag-rev);  }

    /* ── Archive toggle ───────────────────────────────────────────────────── */
    #archive-toggle {
      display: flex;
      gap: 0;
      border: 1px solid var(--border2);
      border-radius: 4px;
      overflow: hidden;
      flex-shrink: 0;
    }

    .toggle-btn {
      background: var(--surface2);
      border: none;
      color: var(--text-muted);
      font-family: inherit;
      font-size: 12px;
      padding: 4px 12px;
      cursor: pointer;
      transition: background 0.1s, color 0.1s;
    }

    .toggle-btn + .toggle-btn {
      border-left: 1px solid var(--border2);
    }

    .toggle-btn.active {
      background: var(--accent-dim);
      color: var(--accent);
      font-weight: 600;
    }

    /* ── Archive action button on cards ──────────────────────────────────── */
    .card-actions {
      display: flex;
      justify-content: flex-end;
      margin-top: 8px;
    }

    .btn-archive, .btn-restore {
      background: none;
      border: 1px solid var(--border2);
      color: var(--text-muted);
      font-family: inherit;
      font-size: 11px;
      padding: 3px 10px;
      border-radius: 4px;
      cursor: pointer;
      transition: border-color 0.1s, color 0.1s;
    }

    .btn-archive:hover {
      border-color: var(--danger);
      color: var(--danger);
    }

    .btn-restore:hover {
      border-color: var(--flag-read);
      color: var(--flag-read);
    }

    .flag-archived { background: #2a1a1a; color: var(--danger); }

    /* ── Empty / loading / error states ──────────────────────────────────── */
    .state-box {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-muted);
      font-size: 13px;
    }

    .state-box .icon {
      font-size: 32px;
      margin-bottom: 12px;
    }

    /* ── Pagination ──────────────────────────────────────────────────────── */
    #pagination {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 16px 20px;
      border-top: 1px solid var(--border);
      flex-shrink: 0;
      background: var(--surface);
    }

    .page-btn {
      background: var(--surface2);
      border: 1px solid var(--border2);
      color: var(--text-muted);
      font-family: inherit;
      font-size: 12px;
      padding: 4px 12px;
      border-radius: 4px;
      cursor: pointer;
      transition: border-color 0.1s, color 0.1s;
    }

    .page-btn:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }

    .page-btn:not(:disabled):hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    #page-info {
      font-size: 12px;
      color: var(--text-muted);
    }

    /* ── Scrollbar ───────────────────────────────────────────────────────── */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #555; }
  </style>
</head>
<body>
<div id="layout">

  <!-- ── Sidebar ──────────────────────────────────────────────────────────── -->
  <aside id="sidebar">
    <div id="sidebar-header">
      <h1>🔖 Bookmarks</h1>
      <p id="sidebar-subtitle">Loading…</p>
    </div>
    <nav id="sidebar-nav">
      <button class="nav-item active" data-id="" onclick="selectCategory(null, 'All bookmarks', this)">
        <span class="nav-item-label">All bookmarks</span>
      </button>
    </nav>
  </aside>

  <!-- ── Main ─────────────────────────────────────────────────────────────── -->
  <div id="main">

    <div id="topbar">
      <span id="topbar-title">All bookmarks</span>
      <span id="topbar-count"></span>
      <a href="/categories" class="nav-btn">⚙ Categories</a>
      <button class="nav-btn" onclick="triggerBackup()">⬇ Backup</button>
      <div id="archive-toggle">
        <button class="toggle-btn active" id="btn-active"   onclick="setArchived(false)">Active</button>
        <button class="toggle-btn"        id="btn-archived" onclick="setArchived(true)">Archived</button>
      </div>
      <button class="sort-btn active" id="btn-newest" onclick="setSort('newest')">↓ Newest</button>
      <button class="sort-btn"        id="btn-oldest" onclick="setSort('oldest')">↑ Oldest</button>
    </div>

    <div id="content">
      <div class="state-box"><div class="icon">⏳</div>Loading…</div>
    </div>

    <footer style="position:fixed;bottom:0;left:0;right:0;text-align:center;padding:0.3rem 0;color:#ffffff;font-size:0.68rem;background:var(--bg);border-top:1px solid var(--border);z-index:50;">
      © 2026 Jaco Steyn — Licensed under CC BY-SA 4.0
    </footer>

    <div id="pagination" style="display:none">
      <button class="page-btn" id="btn-prev" onclick="changePage(-1)">← Prev</button>
      <span id="page-info"></span>
      <button class="page-btn" id="btn-next" onclick="changePage(1)">Next →</button>
    </div>

  </div>
</div>

<!-- ── Edit modal ─────────────────────────────────────────────────────────── -->
<div id="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="modal-title">
  <div id="modal">
    <h2 id="modal-title">Edit Bookmark</h2>

    <div class="modal-field">
      <label>Title</label>
      <input type="text" id="edit-title" />
    </div>

    <div class="modal-field">
      <label>URL</label>
      <input type="text" id="edit-url" />
    </div>

    <div class="modal-field">
      <label>Description</label>
      <textarea id="edit-description" rows="3"></textarea>
    </div>

    <div class="modal-field">
      <label>Flags</label>
      <div class="flag-toggles">
        <label class="flag-toggle"><input type="checkbox" id="flag-readLater" /> Read Later</label>
        <label class="flag-toggle"><input type="checkbox" id="flag-hotTopic" /> Hot Topic</label>
        <label class="flag-toggle"><input type="checkbox" id="flag-cheatsheets" /> Cheatsheet</label>
        <label class="flag-toggle"><input type="checkbox" id="flag-forReview" /> For Review</label>
      </div>
    </div>

    <div class="modal-field">
      <label>Classifications</label>
      <input type="text" class="picker-search" id="class-search" placeholder="Filter…" oninput="filterChips('class')" />
      <div class="picker-list" id="class-chips"></div>
      <button type="button" class="btn-add-new-class" onclick="openCreateClassModal()">+ Add New Classification</button>
    </div>

    <div class="modal-field">
      <label>Tags</label>
      <input type="text" class="picker-search" id="tag-search" placeholder="Filter or create new tag…" oninput="filterChips('tag')" />
      <div class="picker-list" id="tag-chips"></div>
    </div>

    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal()">Cancel</button>
      <button class="btn-primary" id="modal-save" onclick="saveEdit()">Save</button>
    </div>
  </div>
</div>

<!-- ── Create-classification sub-modal ──────────────────────────────────── -->
<div id="create-class-overlay" role="dialog" aria-modal="true" aria-labelledby="create-class-title">
  <div id="create-class-modal">
    <h3 id="create-class-title">New Classification</h3>

    <div class="create-class-field">
      <label for="cc-name">Name</label>
      <input type="text" id="cc-name" placeholder="e.g. TypeScript" autocomplete="off" />
    </div>

    <div class="create-class-field">
      <label>Group</label>
      <div class="create-class-radios">
        <label class="create-class-radio-label">
          <input type="radio" name="cc-group-option" value="none" checked onchange="updateCCGroupSections()" />
          No group
        </label>
        <label class="create-class-radio-label" id="cc-existing-radio-label">
          <input type="radio" name="cc-group-option" value="existing" onchange="updateCCGroupSections()" />
          Existing group
        </label>
        <label class="create-class-radio-label">
          <input type="radio" name="cc-group-option" value="new" onchange="updateCCGroupSections()" />
          New group
        </label>
      </div>
    </div>

    <div class="create-class-field" id="cc-existing-section" style="display:none">
      <label for="cc-existing-select">Select group</label>
      <select id="cc-existing-select">
        <option value="">— choose —</option>
      </select>
    </div>

    <div class="create-class-field" id="cc-new-section" style="display:none">
      <label for="cc-new-group-name">New group name</label>
      <input type="text" id="cc-new-group-name" placeholder="e.g. Languages" autocomplete="off" />
    </div>

    <div id="create-class-error"></div>

    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeCreateClassModal()">Cancel</button>
      <button class="btn-primary" id="cc-create-btn" onclick="handleCreateClassification()">Create</button>
    </div>
  </div>
</div>

<script>
  // ── Backup ─────────────────────────────────────────────────────────────────
  function triggerBackup() {
    const token = window.prompt('Enter backup token:');
    if (token === null || token.trim() === '') return; // cancelled or empty
    window.location.href = '/backup?token=' + encodeURIComponent(token.trim());
  }

  // ── State ──────────────────────────────────────────────────────────────────
  const PAGE_SIZE = 20;
  let state = {
    classificationId: null,   // null = all
    filterTagId:      null,   // null = all
    filterFlag:       null,   // null | 'readLater' | 'hotTopic' | 'cheatsheets' | 'forReview'
    categoryLabel: 'All bookmarks',
    sortBy: 'newest',
    showArchived: false,
    page: 0,
    total: 0,
    lastItems: [],            // cached for edit modal
    tagSortOrder: 'count',    // 'count' | 'alpha'
  };

  // ── Boot ───────────────────────────────────────────────────────────────────
  loadSidebar();
  fetchBookmarks();

  // ── Sidebar ────────────────────────────────────────────────────────────────
  async function loadSidebar() {
    try {
      const [classRes, tagRes, flagRes] = await Promise.all([
        fetch('/classifications'),
        fetch('/tags?limit=200'),
        fetch('/flag-counts'),
      ]);
      if (!classRes.ok) throw new Error(classRes.statusText);
      const { groups } = await classRes.json();
      const { items: tagItems } = tagRes.ok ? await tagRes.json() : { items: [] };
      const flagCounts = flagRes.ok ? await flagRes.json() : {};

      const nav = document.getElementById('sidebar-nav');

      // ── subtitle ─────────────────────────────────────────────────────────
      let totalCats = 0;
      groups.forEach(g => totalCats += g.classifications.length);
      document.getElementById('sidebar-subtitle').textContent =
        `${totalCats} categories · ${tagItems.length} tags`;

      // ── Categories ───────────────────────────────────────────────────────
      const catHeading = document.createElement('div');
      catHeading.className = 'nav-group-heading';
      catHeading.textContent = 'Categories';
      nav.appendChild(catHeading);

      groups.forEach(group => {
        if (!group.classifications.length) return;

        const heading = document.createElement('div');
        heading.className = 'nav-section-label';
        heading.textContent = group.name;
        nav.appendChild(heading);

        group.classifications.forEach(c => {
          const btn = document.createElement('button');
          btn.className = 'nav-item cat-item';
          btn.dataset.id = String(c.id);
          btn.title = c.name;
          btn.onclick = () => selectCategory(c.id, c.name, btn);

          const label = document.createElement('span');
          label.className = 'nav-item-label';
          label.textContent = c.name;

          const count = document.createElement('span');
          count.className = 'nav-item-count';
          count.textContent = String(c.bookmarkCount ?? 0);

          btn.appendChild(label);
          btn.appendChild(count);
          nav.appendChild(btn);
        });
      });

      // ── Flags ─────────────────────────────────────────────────────────────
      const flagHeading = document.createElement('div');
      flagHeading.className = 'nav-group-heading';
      flagHeading.textContent = 'Flags';
      nav.appendChild(flagHeading);

      const flagDefs = [
        { key: 'readLater',   label: 'Read Later',  cls: 'flag-read' },
        { key: 'hotTopic',    label: 'Hot Topic',   cls: 'flag-hot'  },
        { key: 'cheatsheets', label: 'Cheatsheet',  cls: 'flag-cs'   },
        { key: 'forReview',   label: 'For Review',  cls: 'flag-rev'  },
      ];
      flagDefs.forEach(({ key, label, cls }) => {
        const btn = document.createElement('button');
        btn.className = `nav-item flag-dot ${cls}`;
        btn.title = label;
        btn.onclick = () => selectFlag(key, label, btn);

        const lbl = document.createElement('span');
        lbl.className = 'nav-item-label';
        lbl.textContent = label;

        const cnt = document.createElement('span');
        cnt.className = 'nav-item-count';
        cnt.textContent = String(flagCounts[key] ?? 0);

        btn.appendChild(lbl);
        btn.appendChild(cnt);
        nav.appendChild(btn);
      });

      // ── Tags ──────────────────────────────────────────────────────────────
      if (tagItems.length > 0) {
        const tagHeading = document.createElement('div');
        tagHeading.className = 'nav-group-heading';
        tagHeading.id = 'tag-section-heading';

        const headingLabel = document.createElement('span');
        headingLabel.className = 'nav-group-heading-label';
        headingLabel.textContent = 'Tags';

        const sortToggle = document.createElement('div');
        sortToggle.className = 'tag-sort-toggle';

        const btnCount = document.createElement('button');
        btnCount.className = 'tag-sort-btn' + (state.tagSortOrder === 'count' ? ' active' : '');
        btnCount.textContent = '#';
        btnCount.title = 'Sort by count';

        const btnAlpha = document.createElement('button');
        btnAlpha.className = 'tag-sort-btn' + (state.tagSortOrder === 'alpha' ? ' active' : '');
        btnAlpha.textContent = 'A';
        btnAlpha.title = 'Sort alphabetically';

        btnCount.onclick = (e) => { e.stopPropagation(); setTagSort('count'); };
        btnAlpha.onclick = (e) => { e.stopPropagation(); setTagSort('alpha'); };

        sortToggle.appendChild(btnCount);
        sortToggle.appendChild(btnAlpha);
        tagHeading.appendChild(headingLabel);
        tagHeading.appendChild(sortToggle);
        nav.appendChild(tagHeading);

        renderTagList(tagItems);
      }

    } catch (e) {
      document.getElementById('sidebar-subtitle').textContent = 'Failed to load';
      console.error('loadSidebar:', e);
    }
  }

  function renderTagList(tagItems) {
    // Remove existing tag nav-items (but not the heading)
    document.querySelectorAll('.nav-item[data-tag-id]').forEach(el => el.remove());

    const nav = document.getElementById('sidebar-nav');

    tagItems.forEach(tag => {
      const btn = document.createElement('button');
      btn.className = 'nav-item';
      btn.dataset.tagId = String(tag.id);
      btn.title = tag.name;
      if (state.filterTagId === tag.id) btn.classList.add('active');
      btn.onclick = () => selectTag(tag.id, `#${tag.name}`, btn);

      const lbl = document.createElement('span');
      lbl.className = 'nav-item-label';
      lbl.textContent = `#${tag.name}`;

      const cnt = document.createElement('span');
      cnt.className = 'nav-item-count';
      cnt.textContent = String(tag.bookmarkCount ?? 0);

      btn.appendChild(lbl);
      btn.appendChild(cnt);
      nav.appendChild(btn);
    });
  }

  async function setTagSort(order) {
    if (state.tagSortOrder === order) return;
    state.tagSortOrder = order;

    // Update toggle button appearance
    document.querySelectorAll('.tag-sort-btn').forEach(b => b.classList.remove('active'));
    const target = order === 'count'
      ? document.querySelector('.tag-sort-btn[title="Sort by count"]')
      : document.querySelector('.tag-sort-btn[title="Sort alphabetically"]');
    if (target) target.classList.add('active');

    // Fetch sorted tags and re-render
    try {
      const res = await fetch(`/tags?limit=200&sort=${order}`);
      if (!res.ok) return;
      const { items } = await res.json();
      renderTagList(items);
    } catch (e) {
      console.error('setTagSort:', e);
    }
  }

  // Refresh sidebar counts after any mutation (edit, archive, restore)
  async function refreshCounts() {
    try {
      const [flagRes, tagRes, classRes] = await Promise.all([
        fetch('/flag-counts'),
        fetch(`/tags?limit=200&sort=${state.tagSortOrder}`),
        fetch('/classifications'),
      ]);

      if (flagRes.ok) {
        const flagCounts = await flagRes.json();
        const flagDefs = [
          { key: 'readLater', cls: 'flag-read' },
          { key: 'hotTopic',  cls: 'flag-hot'  },
          { key: 'cheatsheets', cls: 'flag-cs' },
          { key: 'forReview', cls: 'flag-rev'  },
        ];
        flagDefs.forEach(({ key, cls }) => {
          const btn = document.querySelector(`.nav-item.${cls}`);
          if (btn) {
            const cnt = btn.querySelector('.nav-item-count');
            if (cnt) cnt.textContent = String(flagCounts[key] ?? 0);
          }
        });
      }

      if (tagRes.ok) {
        const { items } = await tagRes.json();
        // Update counts on existing tag buttons; re-render if list changed
        let changed = false;
        items.forEach(tag => {
          const btn = document.querySelector(`.nav-item[data-tag-id="${tag.id}"]`);
          if (btn) {
            const cnt = btn.querySelector('.nav-item-count');
            if (cnt) cnt.textContent = String(tag.bookmarkCount ?? 0);
          } else {
            changed = true;
          }
        });
        if (changed) renderTagList(items);
      }

      if (classRes.ok) {
        const { groups } = await classRes.json();
        groups.forEach(group => {
          group.classifications.forEach(c => {
            const btn = document.querySelector(`.nav-item[data-id="${c.id}"]`);
            if (btn) {
              const cnt = btn.querySelector('.nav-item-count');
              if (cnt) cnt.textContent = String(c.bookmarkCount ?? 0);
            }
          });
        });
      }
    } catch (e) {
      console.error('refreshCounts:', e);
    }
  }

  function clearNavActive() {
    document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
  }

  function selectCategory(id, label, btnEl) {
    clearNavActive();
    btnEl.classList.add('active');
    state.classificationId = id;
    state.filterTagId      = null;
    state.filterFlag       = null;
    state.categoryLabel    = label;
    state.page = 0;
    document.getElementById('topbar-title').textContent = label;
    fetchBookmarks();
  }

  function selectFlag(flag, label, btnEl) {
    clearNavActive();
    btnEl.classList.add('active');
    state.classificationId = null;
    state.filterTagId      = null;
    state.filterFlag       = flag;
    state.categoryLabel    = label;
    state.page = 0;
    document.getElementById('topbar-title').textContent = label;
    fetchBookmarks();
  }

  function selectTag(id, label, btnEl) {
    clearNavActive();
    btnEl.classList.add('active');
    state.classificationId = null;
    state.filterTagId      = id;
    state.filterFlag       = null;
    state.categoryLabel    = label;
    state.page = 0;
    document.getElementById('topbar-title').textContent = label;
    fetchBookmarks();
  }

  // ── Sort ───────────────────────────────────────────────────────────────────
  function setSort(dir) {
    state.sortBy = dir;
    state.page = 0;
    document.getElementById('btn-newest').classList.toggle('active', dir === 'newest');
    document.getElementById('btn-oldest').classList.toggle('active', dir === 'oldest');
    fetchBookmarks();
  }

  // ── Archived toggle ────────────────────────────────────────────────────────
  function setArchived(archived) {
    state.showArchived = archived;
    state.page = 0;
    document.getElementById('btn-active').classList.toggle('active', !archived);
    document.getElementById('btn-archived').classList.toggle('active', archived);
    fetchBookmarks();
  }

  // ── Pagination ─────────────────────────────────────────────────────────────
  function changePage(delta) {
    const maxPage = Math.ceil(state.total / PAGE_SIZE) - 1;
    state.page = Math.max(0, Math.min(maxPage, state.page + delta));
    fetchBookmarks();
  }

  // ── Fetch & render bookmarks ───────────────────────────────────────────────
  async function fetchBookmarks() {
    const content = document.getElementById('content');
    content.innerHTML = '<div class="state-box"><div class="icon">⏳</div>Loading…</div>';
    document.getElementById('pagination').style.display = 'none';

    const params = new URLSearchParams({
      limit: String(PAGE_SIZE),
      offset: String(state.page * PAGE_SIZE),
      sortBy: state.sortBy,
    });
    if (state.classificationId) params.set('classificationId', String(state.classificationId));
    if (state.filterTagId)      params.set('tagId', String(state.filterTagId));
    if (state.filterFlag)       params.set('flag', state.filterFlag);
    if (state.showArchived)     params.set('archived', 'true');

    try {
      const res = await fetch('/bookmarks?' + params);
      if (!res.ok) throw new Error(res.statusText);
      const { items, total } = await res.json();

      state.total = total;
      state.lastItems = items;
      document.getElementById('topbar-count').textContent =
        total === 0 ? 'No bookmarks' : `${total} bookmark${total === 1 ? '' : 's'}`;

      if (items.length === 0) {
        content.innerHTML = '<div class="state-box"><div class="icon">🔍</div>No bookmarks here yet.</div>';
        return;
      }

      content.innerHTML = items.map(renderCard).join('');

      // Pagination
      const totalPages = Math.ceil(total / PAGE_SIZE);
      if (totalPages > 1) {
        const pg = document.getElementById('pagination');
        pg.style.display = 'flex';
        document.getElementById('btn-prev').disabled = state.page === 0;
        document.getElementById('btn-next').disabled = state.page >= totalPages - 1;
        document.getElementById('page-info').textContent =
          `Page ${state.page + 1} of ${totalPages}`;
      }

    } catch (e) {
      content.innerHTML = `<div class="state-box"><div class="icon">⚠️</div>Failed to load bookmarks.<br><small>${e.message}</small></div>`;
      console.error('fetchBookmarks:', e);
    }
  }

  // ── Card renderer ──────────────────────────────────────────────────────────
  function renderCard(b) {
    const domain = (() => {
      try { return new URL(b.url).hostname; } catch { return ''; }
    })();

    const favicon = b.faviconUrl
      ? `<img class="card-favicon" src="${esc(b.faviconUrl)}" alt="" onerror="this.style.display='none'" />`
      : `<img class="card-favicon" src="https://www.google.com/s2/favicons?domain=${esc(domain)}&sz=16" alt="" onerror="this.style.display='none'" />`;

    const description = b.description
      ? `<div class="card-description">${esc(b.description)}</div>`
      : '';

    const tags = (b.tags || [])
      .map(t => `<span class="tag">#${esc(t.name)}</span>`)
      .join('');

    const classes = (b.classifications || [])
      .map(c => {
        const grp = c.groupName ? `<span class="classification-group">${esc(c.groupName)} ›</span>` : '';
        return `<span class="classification-badge">${grp}${esc(c.name)}</span>`;
      })
      .join('');

    const flagsHtml = [
      b.readLater  ? `<span class="flag flag-read">READ LATER</span>` : '',
      b.hotTopic   ? `<span class="flag flag-hot">HOT TOPIC</span>`   : '',
      b.cheatsheets? `<span class="flag flag-cs">CHEATSHEET</span>`   : '',
      b.forReview  ? `<span class="flag flag-rev">FOR REVIEW</span>`  : '',
      b.archivedAt ? `<span class="flag flag-archived">ARCHIVED</span>` : '',
    ].filter(Boolean).join('');

    const dateStr = b.createdAt ? formatDate(b.createdAt) : '';

    const flagsRow = flagsHtml
      ? `<div class="card-meta-row"><span class="card-meta-label">Flags</span>${flagsHtml}</div>` : '';
    const classesRow = classes
      ? `<div class="card-meta-row"><span class="card-meta-label">Categories</span>${classes}</div>` : '';
    const tagsRow = tags
      ? `<div class="card-meta-row"><span class="card-meta-label">Tags</span>${tags}</div>` : '';
    const dateRow = dateStr
      ? `<div class="card-meta-row"><span class="card-meta-label">Saved</span><span class="card-meta-date">${dateStr}</span></div>` : '';

    const actionBtn = state.showArchived
      ? `<button class="btn-restore" data-id="${b.id}" title="Restore bookmark">↩ Restore</button>`
      : `<button class="btn-edit" data-id="${b.id}" title="Edit bookmark">✎ Edit</button><button class="btn-archive" data-id="${b.id}" title="Archive bookmark">Archive</button>`;

    return `
    <div class="card" data-bookmark-id="${b.id}">
      <div class="card-title-row">
        ${favicon}
        <div class="card-title">
          <a href="${esc(b.url)}" target="_blank" rel="noopener noreferrer">${esc(b.title)}</a>
        </div>
      </div>
      <div class="card-url">${esc(b.url)}</div>
      ${description}
      <div class="card-meta">
        ${flagsRow}${classesRow}${tagsRow}${dateRow}
      </div>
      <div class="card-actions">${actionBtn}</div>
    </div>`;
  }

  // ── Archive / Restore actions (delegated) ──────────────────────────────────
  document.getElementById('content').addEventListener('click', async (e) => {
    const editBtn    = e.target.closest('.btn-edit');
    const archiveBtn = e.target.closest('.btn-archive');
    const restoreBtn = e.target.closest('.btn-restore');
    if (!editBtn && !archiveBtn && !restoreBtn) return;

    if (editBtn) {
      const id = Number(editBtn.dataset.id);
      const card = editBtn.closest('.card');
      // Read current data from the rendered card's bookmark data
      const bm = state.lastItems?.find(b => b.id === id);
      if (bm) openModal(bm);
      return;
    }

    const btn = archiveBtn || restoreBtn;
    const id = btn.dataset.id;
    const action = archiveBtn ? 'archive' : 'restore';

    if (archiveBtn) {
      const bm = state.lastItems?.find(b => String(b.id) === id);
      const label = bm?.title ? `"${bm.title}"` : 'this bookmark';
      if (!confirm(`Archive ${label}?`)) return;
    }

    btn.disabled = true;
    btn.textContent = action === 'archive' ? 'Archiving…' : 'Restoring…';

    try {
      const res = await fetch(`/bookmarks/${id}/${action}`, { method: 'PATCH' });
      if (!res.ok) {
        const data = await res.json().catch(() => ({}));
        alert(data.error || `Failed to ${action}`);
        btn.disabled = false;
        btn.textContent = action === 'archive' ? 'Archive' : '↩ Restore';
        return;
      }
      // Remove the card from the current view immediately
      const card = btn.closest('.card');
      card.style.transition = 'opacity 0.2s';
      card.style.opacity = '0';
      setTimeout(() => {
        card.remove();
        // Update the count
        state.total = Math.max(0, state.total - 1);
        document.getElementById('topbar-count').textContent =
          state.total === 0 ? 'No bookmarks' :
          `${state.total} bookmark${state.total === 1 ? '' : 's'}`;
        if (document.querySelectorAll('.card').length === 0) {
          document.getElementById('content').innerHTML =
            `<div class="state-box"><div class="icon">🔍</div>No bookmarks here yet.</div>`;
        }
        refreshCounts();   // update sidebar counts
      }, 200);
    } catch (err) {
      alert(`Failed to ${action}: ${err.message}`);
      btn.disabled = false;
      btn.textContent = action === 'archive' ? 'Archive' : '↩ Restore';
    }
  });

  // ── Edit modal ─────────────────────────────────────────────────────────────
  let modalState = {
    bookmarkId: null,
    allClasses: [],   // [{id, name, groupName}]
    allGroups:  [],   // [{id, name}]  — for the create-classification sub-modal
    allTags:    [],   // [{id, name}]
    selClassIds: new Set(),
    selTagIds:   new Set(),
  };

  // Pre-load classifications & tags for the modal (shared data, refreshed on open)
  async function loadModalData() {
    const [cRes, tRes] = await Promise.all([
      fetch('/classifications'),
      fetch('/tags?limit=200'),
    ]);
    const { groups } = await cRes.json();
    const { items: tagItems } = await tRes.json();

    // Flatten all active classifications with group info
    const flatClasses = [];
    const flatGroups = [];
    groups.forEach(g => {
      if (g.name !== 'Ungrouped') {
        flatGroups.push({ id: g.id, name: g.name });
      }
      g.classifications.forEach(c => {
        flatClasses.push({ id: c.id, name: c.name, groupName: g.name !== 'Ungrouped' ? g.name : null });
      });
    });
    modalState.allClasses = flatClasses;
    modalState.allGroups  = flatGroups;
    modalState.allTags = tagItems;
  }

  async function openModal(bm) {
    await loadModalData();

    modalState.bookmarkId = bm.id;
    modalState.selClassIds = new Set((bm.classifications || []).map(c => c.id));
    modalState.selTagIds   = new Set((bm.tags || []).map(t => t.id));

    document.getElementById('edit-title').value = bm.title || '';
    document.getElementById('edit-url').value = bm.url || '';
    document.getElementById('edit-description').value = bm.description || '';
    document.getElementById('flag-readLater').checked   = !!bm.readLater;
    document.getElementById('flag-hotTopic').checked    = !!bm.hotTopic;
    document.getElementById('flag-cheatsheets').checked = !!bm.cheatsheets;
    document.getElementById('flag-forReview').checked   = !!bm.forReview;

    document.getElementById('class-search').value = '';
    document.getElementById('tag-search').value   = '';
    renderChips('class');
    renderChips('tag');

    document.getElementById('modal-overlay').classList.add('open');
    document.getElementById('edit-title').focus();
  }

  function closeModal() {
    document.getElementById('modal-overlay').classList.remove('open');
  }

  // Close on overlay click (outside modal box)
  document.getElementById('modal-overlay').addEventListener('click', e => {
    if (e.target === document.getElementById('modal-overlay')) closeModal();
  });

  // Close on Escape — but if tag-search has content, just clear it first
  document.addEventListener('keydown', e => {
    if (e.key !== 'Escape') return;
    const tagSearch = document.getElementById('tag-search');
    if (tagSearch && tagSearch.value) {
      tagSearch.value = '';
      renderChips('tag');
    } else {
      closeModal();
    }
  });

  function filterChips(type) { renderChips(type); }

  function renderChips(type) {
    const isClass = type === 'class';
    const query = (document.getElementById(isClass ? 'class-search' : 'tag-search').value || '').toLowerCase();
    const list  = document.getElementById(isClass ? 'class-chips' : 'tag-chips');
    const items = isClass ? modalState.allClasses : modalState.allTags;
    const selSet = isClass ? modalState.selClassIds : modalState.selTagIds;

    const filtered = items.filter(item => item.name.toLowerCase().includes(query));

    list.innerHTML = filtered.map(item => {
      const label = isClass && item.groupName ? `${item.groupName} › ${item.name}` : item.name;
      const sel = selSet.has(item.id) ? ' selected' : '';
      return `<span class="picker-chip${sel}" data-id="${item.id}" data-type="${type}">${esc(label)}</span>`;
    }).join('');

    // Show "create" chip for tags if no exact match
    if (!isClass && query && !items.some(t => t.name.toLowerCase() === query)) {
      list.innerHTML += `<span class="picker-chip" data-type="tag-create" data-name="${esc(query)}">+ "${esc(query)}"</span>`;
    }
  }

  // Chip click — toggle selection or create tag
  document.getElementById('class-chips').addEventListener('click', e => {
    const chip = e.target.closest('.picker-chip');
    if (!chip) return;
    const id = Number(chip.dataset.id);
    if (modalState.selClassIds.has(id)) modalState.selClassIds.delete(id);
    else modalState.selClassIds.add(id);
    renderChips('class');
  });

  // ── Create-classification sub-modal ────────────────────────────────────────
  function openCreateClassModal() {
    // Reset form
    document.getElementById('cc-name').value = '';
    document.getElementById('cc-new-group-name').value = '';
    document.getElementById('create-class-error').textContent = '';
    document.querySelector('input[name="cc-group-option"][value="none"]').checked = true;
    updateCCGroupSections();

    // Populate existing-groups dropdown
    const sel = document.getElementById('cc-existing-select');
    sel.innerHTML = '<option value="">— choose —</option>';
    const existingRadioLabel = document.getElementById('cc-existing-radio-label');
    if (modalState.allGroups.length === 0) {
      existingRadioLabel.style.opacity = '0.4';
      existingRadioLabel.querySelector('input').disabled = true;
    } else {
      existingRadioLabel.style.opacity = '1';
      existingRadioLabel.querySelector('input').disabled = false;
      modalState.allGroups.forEach(g => {
        const opt = document.createElement('option');
        opt.value = String(g.id);
        opt.textContent = g.name;
        sel.appendChild(opt);
      });
    }

    document.getElementById('create-class-overlay').classList.add('open');
    setTimeout(() => document.getElementById('cc-name').focus(), 60);
  }

  function closeCreateClassModal() {
    document.getElementById('create-class-overlay').classList.remove('open');
  }

  function updateCCGroupSections() {
    const val = document.querySelector('input[name="cc-group-option"]:checked')?.value;
    document.getElementById('cc-existing-section').style.display = val === 'existing' ? '' : 'none';
    document.getElementById('cc-new-section').style.display     = val === 'new'      ? '' : 'none';
  }

  async function handleCreateClassification() {
    const errEl  = document.getElementById('create-class-error');
    const btn    = document.getElementById('cc-create-btn');
    const name   = document.getElementById('cc-name').value.trim();

    errEl.textContent = '';
    if (!name) { errEl.textContent = 'Classification name is required.'; return; }

    const groupOption = document.querySelector('input[name="cc-group-option"]:checked')?.value;
    let groupId   = null;
    let groupName = null;

    if (groupOption === 'existing') {
      const v = document.getElementById('cc-existing-select').value;
      groupId = v ? Number(v) : null;
      if (!groupId) { errEl.textContent = 'Please select an existing group.'; return; }
    } else if (groupOption === 'new') {
      groupName = document.getElementById('cc-new-group-name').value.trim() || null;
      if (!groupName) { errEl.textContent = 'Please enter a name for the new group.'; return; }
    }

    btn.disabled = true;
    btn.textContent = 'Creating…';

    try {
      const payload = { name };
      if (groupId   != null) payload.groupId   = groupId;
      if (groupName != null) payload.groupName = groupName;

      const res  = await fetch('/classifications', {
        method:  'POST',
        headers: { 'Content-Type': 'application/json' },
        body:    JSON.stringify(payload),
      });
      const data = await res.json().catch(() => ({}));

      if (!res.ok) {
        errEl.textContent = data.error || 'Failed to create classification.';
        return;
      }

      // Resolve the group name for display
      let resolvedGroupName = null;
      if (groupOption === 'existing') {
        resolvedGroupName = modalState.allGroups.find(g => g.id === groupId)?.name ?? null;
      } else if (groupOption === 'new') {
        resolvedGroupName = groupName;
        // If the API returned a new groupId, add it to allGroups so the dropdown stays current
        if (data.groupId) {
          const already = modalState.allGroups.some(g => g.id === data.groupId);
          if (!already) modalState.allGroups.push({ id: data.groupId, name: groupName });
        }
      }

      // Add to local state and auto-select
      const newClass = { id: data.id, name: data.name, groupName: resolvedGroupName };
      modalState.allClasses.push(newClass);
      modalState.selClassIds.add(data.id);

      closeCreateClassModal();
      document.getElementById('class-search').value = '';
      renderChips('class');
    } catch (err) {
      errEl.textContent = 'Failed to create classification: ' + err.message;
    } finally {
      btn.disabled = false;
      btn.textContent = 'Create';
    }
  }

  // Close sub-modal on overlay click
  document.getElementById('create-class-overlay').addEventListener('click', e => {
    if (e.target === document.getElementById('create-class-overlay')) closeCreateClassModal();
  });

  // Enter in cc-name submits the form
  document.getElementById('cc-name').addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); handleCreateClassification(); }
  });

  async function createOrSelectTag(name) {
    const trimmed = name.trim();
    if (!trimmed) return;

    // If an exact match exists, just select it
    const existing = modalState.allTags.find(t => t.name.toLowerCase() === trimmed.toLowerCase());
    if (existing) {
      modalState.selTagIds.add(existing.id);
      document.getElementById('tag-search').value = '';
      renderChips('tag');
      return;
    }

    // Otherwise create it
    try {
      const res = await fetch('/tags', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name: trimmed }),
      });
      const data = await res.json();
      if (!res.ok) { alert(data.error || 'Failed to create tag'); return; }
      modalState.allTags.push({ id: data.id, name: data.name });
      modalState.selTagIds.add(data.id);
      document.getElementById('tag-search').value = '';
      renderChips('tag');
    } catch (err) { alert('Failed to create tag: ' + err.message); }
  }

  // Enter in tag search → create/select immediately
  document.getElementById('tag-search').addEventListener('keydown', async e => {
    if (e.key !== 'Enter') return;
    e.preventDefault();
    await createOrSelectTag(document.getElementById('tag-search').value);
  });

  document.getElementById('tag-chips').addEventListener('click', async e => {
    const chip = e.target.closest('.picker-chip');
    if (!chip) return;

    if (chip.dataset.type === 'tag-create') {
      await createOrSelectTag(chip.dataset.name);
      return;
    }

    const id = Number(chip.dataset.id);
    if (modalState.selTagIds.has(id)) modalState.selTagIds.delete(id);
    else modalState.selTagIds.add(id);
    renderChips('tag');
  });

  async function saveEdit() {
    const saveBtn = document.getElementById('modal-save');
    saveBtn.disabled = true;
    saveBtn.textContent = 'Saving…';

    const body = {
      title:             document.getElementById('edit-title').value.trim(),
      url:               document.getElementById('edit-url').value.trim() || undefined,
      description:       document.getElementById('edit-description').value.trim() || null,
      classificationIds: [...modalState.selClassIds],
      tagIds:            [...modalState.selTagIds],
      flags: {
        readLater:   document.getElementById('flag-readLater').checked,
        hotTopic:    document.getElementById('flag-hotTopic').checked,
        cheatsheets: document.getElementById('flag-cheatsheets').checked,
        forReview:   document.getElementById('flag-forReview').checked,
      },
    };

    try {
      const res = await fetch(`/bookmarks/${modalState.bookmarkId}`, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
      });
      if (!res.ok) {
        const data = await res.json().catch(() => ({}));
        alert(data.error || 'Failed to save');
        return;
      }
      closeModal();
      await fetchBookmarks();    // reload to show updated card
      await refreshCounts();     // update sidebar counts
    } catch (err) {
      alert('Failed to save: ' + err.message);
    } finally {
      saveBtn.disabled = false;
      saveBtn.textContent = 'Save';
    }
  }

  // ── Helpers ────────────────────────────────────────────────────────────────
  function esc(str) {
    if (!str) return '';
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  // Display local time as YYYY-MM-DD HH:mm:ss
  function formatDate(raw) {
    try {
      const d = new Date(raw);
      if (isNaN(d)) return raw;
      const pad = n => String(n).padStart(2, '0');
      return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ` +
             `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
    } catch { return raw; }
  }
</script>
</body>
