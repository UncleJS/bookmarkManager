<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Category Management – Bookmark Manager</title>
  <link rel="stylesheet" href="/ui/categories.css" />
</head>
<body>

  <div id="topbar">
    <a class="back-link" href="/app">← Bookmarks</a>
    <h1>Category Management</h1>
    <div id="archive-toggle">
      <button class="toggle-btn active" id="btn-active"   data-action="setView" data-arg="active">Active</button>
      <button class="toggle-btn"        id="btn-archived" data-action="setView" data-arg="archived">Archived</button>
    </div>
    <button class="nav-btn" data-action="logout" title="End this browser session">⏻ Log out</button>
  </div>

  <div id="page">

    <div id="add-category-section">
      <input id="add-category-input" type="text" placeholder="New category name…" maxlength="255"
             data-enter="addCategory" />
      <input id="add-category-desc" type="text" placeholder="Description (optional)…" maxlength="1000"
             data-enter="addCategory" />
      <button id="btn-add-category" data-action="addCategory">+ Add Category</button>
    </div>

    <div id="categories-container">
      <div class="state-box">⏳ Loading…</div>
    </div>

    <footer class="license-footer">
      © 2026 Jaco Steyn — Licensed under CC BY-SA 4.0
    </footer>

  </div>

  <div id="toast"></div>

<script src="/ui/common.js"></script>
<script src="/ui/categories.js"></script>
</body>
</html>
