<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Category Management – Bookmark Manager</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:         #0a0a0a;
      --surface:    #111111;
      --surface2:   #1a1a1a;
      --surface3:   #222222;
      --border:     #2a2a2a;
      --border2:    #333333;
      --text:       #f0f0f0;
      --text-muted: #ffffff;
      --accent:     #4f9cf9;
      --accent-dim: #1d3d6b;
      --danger:     #ef4444;
      --danger-dim: #3b1010;
      --success:    #4ade80;
      --success-dim:#0d2b19;
      --warn:       #facc15;
    }

    html, body {
      min-height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: ui-monospace, 'Cascadia Code', 'Fira Code', monospace;
      font-size: 14px;
      line-height: 1.5;
    }

    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }

    /* ── Topbar ──────────────────────────────────────────────────────────── */
    #topbar {
      position: sticky;
      top: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 12px 24px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
    }

    #topbar a.back-link {
      font-size: 12px;
      color: var(--text-muted);
      white-space: nowrap;
    }
    #topbar a.back-link:hover { color: var(--accent); text-decoration: none; }

    #topbar h1 {
      font-size: 15px;
      font-weight: 700;
      flex: 1;
    }

    /* archive toggle */
    #archive-toggle {
      display: flex;
      border: 1px solid var(--border2);
      border-radius: 4px;
      overflow: hidden;
    }
    .toggle-btn {
      background: var(--surface2);
      border: none;
      color: var(--text-muted);
      font-family: inherit;
      font-size: 12px;
      padding: 4px 12px;
      cursor: pointer;
      transition: background 0.1s, color 0.1s;
    }
    .toggle-btn + .toggle-btn { border-left: 1px solid var(--border2); }
    .toggle-btn.active {
      background: var(--accent-dim);
      color: var(--accent);
      font-weight: 600;
    }

    /* ── Page content ────────────────────────────────────────────────────── */
    #page {
      max-width: 820px;
      margin: 0 auto;
      padding: 24px 20px 60px;
    }

    /* ── Category card ──────────────────────────────────────────────────────── */
    .category-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      margin-bottom: 14px;
      overflow: hidden;
      transition: opacity 0.2s;
    }

    .category-card.archived-row {
      opacity: 0.6;
    }

    .category-header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 16px;
      background: var(--surface2);
      border-bottom: 1px solid var(--border);
    }

    .order-controls {
      display: flex;
      flex-direction: column;
      gap: 1px;
    }

    .btn-order {
      background: none;
      border: 1px solid var(--border2);
      color: var(--text-muted);
      font-size: 9px;
      line-height: 1;
      width: 18px;
      height: 14px;
      border-radius: 2px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      transition: border-color 0.1s, color 0.1s;
    }
    .btn-order:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
    .btn-order:disabled { opacity: 0.25; cursor: not-allowed; }

    .category-name {
      flex: 1;
      font-size: 14px;
      font-weight: 700;
      color: var(--text);
    }

    .category-name-wrap {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .category-desc {
      font-size: 11px;
      color: var(--text-muted);
      opacity: 0.65;
      font-weight: 400;
      margin-top: 1px;
      line-height: 1.3;
    }

    .inline-edit-wrap {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .inline-input {
      flex: 1;
      background: var(--surface3);
      border: 1px solid var(--accent);
      color: var(--text);
      font-family: inherit;
      font-size: 13px;
      padding: 3px 8px;
      border-radius: 4px;
      outline: none;
    }

    .inline-desc-input {
      width: 100%;
      background: var(--surface3);
      border: 1px solid var(--border2);
      color: var(--text);
      font-family: inherit;
      font-size: 12px;
      padding: 3px 8px;
      border-radius: 4px;
      outline: none;
      resize: none;
      transition: border-color 0.1s;
      margin-top: 4px;
    }
    .inline-desc-input:focus { border-color: var(--accent); }

    .badge-archived {
      font-size: 10px;
      font-weight: 700;
      background: var(--danger-dim);
      color: var(--danger);
      border-radius: 3px;
      padding: 1px 6px;
      letter-spacing: 0.05em;
    }

    .btn-icon {
      background: none;
      border: 1px solid var(--border2);
      color: var(--text-muted);
      font-family: inherit;
      font-size: 11px;
      padding: 3px 10px;
      border-radius: 4px;
      cursor: pointer;
      white-space: nowrap;
      transition: border-color 0.1s, color 0.1s;
    }
    .btn-icon:hover { border-color: var(--accent); color: var(--accent); }
    .btn-icon.danger:hover { border-color: var(--danger); color: var(--danger); }
    .btn-icon.success:hover { border-color: var(--success); color: var(--success); }
    .btn-icon.confirm { border-color: var(--accent); color: var(--accent); }
    .btn-icon.cancel  { border-color: var(--border2); color: var(--text-muted); }

    /* ── Sub-category list ─────────────────────────────────────────────── */
    .subcategory-list {
      padding: 8px 16px 12px;
    }

    .subcategory-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 5px 0;
      border-bottom: 1px solid var(--border);
    }
    .subcategory-row:last-child { border-bottom: none; }
    .subcategory-row.archived-row { opacity: 0.55; }

    .subcategory-name {
      flex: 1;
      font-size: 13px;
      color: var(--text);
    }

    .subcategory-desc {
      font-size: 11px;
      color: var(--text-muted);
      opacity: 0.65;
      margin-top: 1px;
      line-height: 1.3;
    }

    .subcategory-name-wrap {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .count-badge {
      font-size: 11px;
      color: #ffffff;
      background: var(--surface3);
      border: 1px solid var(--border2);
      border-radius: 10px;
      padding: 1px 7px;
      white-space: nowrap;
      flex-shrink: 0;
    }

    /* ── Add subcategory row ──────────────────────────────────────────── */
    .add-subcategory-row {
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding: 8px 0 0;
      margin-top: 4px;
    }

    .add-class-inputs {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .add-input {
      flex: 1;
      background: var(--surface3);
      border: 1px solid var(--border2);
      color: var(--text);
      font-family: inherit;
      font-size: 13px;
      padding: 5px 10px;
      border-radius: 4px;
      outline: none;
      transition: border-color 0.1s;
    }
    .add-input:focus { border-color: var(--accent); }

    .add-desc-input {
      width: 100%;
      background: var(--surface3);
      border: 1px solid var(--border2);
      color: var(--text);
      font-family: inherit;
      font-size: 12px;
      padding: 4px 10px;
      border-radius: 4px;
      outline: none;
      transition: border-color 0.1s;
      resize: none;
    }
    .add-desc-input:focus { border-color: var(--accent); }

    .btn-add {
      background: var(--accent-dim);
      border: 1px solid var(--accent);
      color: var(--accent);
      font-family: inherit;
      font-size: 12px;
      padding: 5px 14px;
      border-radius: 4px;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.1s;
    }
    .btn-add:hover { background: #254f8a; }
    .btn-add:disabled { opacity: 0.45; cursor: not-allowed; }

    /* ── Add category footer ────────────────────────────────────────────────── */
    #add-category-section {
      margin-bottom: 20px;
      display: flex;
      gap: 10px;
      align-items: center;
    }

    #add-category-input {
      flex: 1;
      background: var(--surface);
      border: 1px solid var(--border2);
      color: var(--text);
      font-family: inherit;
      font-size: 13px;
      padding: 8px 12px;
      border-radius: 6px;
      outline: none;
      transition: border-color 0.1s;
    }
    #add-category-input:focus { border-color: var(--accent); }

    #btn-add-category {
      background: var(--accent-dim);
      border: 1px solid var(--accent);
      color: var(--accent);
      font-family: inherit;
      font-size: 13px;
      padding: 8px 18px;
      border-radius: 6px;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.1s;
    }
    #btn-add-category:hover { background: #254f8a; }
    #btn-add-category:disabled { opacity: 0.45; cursor: not-allowed; }

    /* ── Toast ───────────────────────────────────────────────────────────── */
    #toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: var(--surface2);
      border: 1px solid var(--border2);
      color: var(--text);
      font-size: 13px;
      padding: 10px 18px;
      border-radius: 6px;
      display: none;
      z-index: 100;
      max-width: 340px;
    }
    #toast.show { display: block; }
    #toast.error { border-color: var(--danger); color: var(--danger); }
    #toast.ok    { border-color: var(--success); color: var(--success); }

    /* ── State boxes ─────────────────────────────────────────────────────── */
    .state-box {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-muted);
      font-size: 13px;
    }

    /* ── Scrollbar ───────────────────────────────────────────────────────── */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #555; }
  </style>
</head>
<body>

  <div id="topbar">
    <a class="back-link" href="/app">← Bookmarks</a>
    <h1>Category Management</h1>
    <div id="archive-toggle">
      <button class="toggle-btn active" id="btn-active"   onclick="setView('active')">Active</button>
      <button class="toggle-btn"        id="btn-archived" onclick="setView('archived')">Archived</button>
    </div>
  </div>

  <div id="page">

    <div id="add-category-section" style="display:none">
      <input id="add-category-input" type="text" placeholder="New category name…" maxlength="255"
             onkeydown="if(event.key==='Enter') addCategory()" />
      <input id="add-category-desc" type="text" placeholder="Description (optional)…" maxlength="1000"
             style="flex:1.5;background:var(--surface);border:1px solid var(--border2);color:var(--text);font-family:inherit;font-size:13px;padding:8px 12px;border-radius:6px;outline:none;transition:border-color 0.1s;"
             onfocus="this.style.borderColor='var(--accent)'" onblur="this.style.borderColor='var(--border2)'"
             onkeydown="if(event.key==='Enter') addCategory()" />
      <button id="btn-add-category" onclick="addCategory()">+ Add Category</button>
    </div>

    <div id="categories-container">
      <div class="state-box">⏳ Loading…</div>
    </div>

    <footer style="position:fixed;bottom:0;left:0;right:0;text-align:center;padding:0.3rem 0;color:#ffffff;font-size:0.68rem;background:var(--bg);border-top:1px solid var(--border);z-index:50;">
      © 2026 Jaco Steyn — Licensed under CC BY-SA 4.0
    </footer>

  </div>

  <div id="toast"></div>

<script>
  // ── API token bootstrap ────────────────────────────────────────────────────
  window.__apiToken = '';

  async function bootstrapToken() {
    try {
      const res = await fetch('/config');
      if (!res.ok) throw new Error('Server returned ' + res.status);
      const { apiToken } = await res.json();
      if (!apiToken) throw new Error('apiToken missing in /config response');
      window.__apiToken = apiToken;
    } catch (e) {
      document.getElementById('categories-container').innerHTML =
        `<div style="padding:2rem;text-align:center;color:#ef4444;">` +
        `Failed to load API configuration: ${e.message}</div>`;
      throw e;
    }
  }

  function apiFetch(url, opts = {}) {
    const headers = Object.assign({ 'Authorization': 'Bearer ' + window.__apiToken }, opts.headers || {});
    return fetch(url, Object.assign({}, opts, { headers }));
  }

  // ── State ──────────────────────────────────────────────────────────────────
  let viewMode = 'active'; // 'active' | 'archived'
  let categories = [];         // [{id, name, order, archivedAt, subcategories:[{..., subSubcategories:[]}]}]

  // ── Boot ───────────────────────────────────────────────────────────────────
  bootstrapToken().then(() => loadAll());

  // ── View toggle ────────────────────────────────────────────────────────────
  function setView(mode) {
    viewMode = mode;
    document.getElementById('btn-active').classList.toggle('active', mode === 'active');
    document.getElementById('btn-archived').classList.toggle('active', mode === 'archived');
    document.getElementById('add-category-section').style.display = mode === 'active' ? 'flex' : 'none';
    renderCategories();
  }

  // ── Load all data ──────────────────────────────────────────────────────────
  async function loadAll() {
    try {
      // GET /categories?archived=true returns all categories with their
      // subcategories (active + archived) and bookmarkCount already embedded.
      const res = await apiFetch('/categories?archived=true');
      if (!res.ok) throw new Error('Failed to fetch');
      const { items: allCategories } = await res.json();

      // Attach uncategorized subcategories (categoryId === null) as a virtual category
      // They come embedded in categories where id matches; collect those with no category
      // by fetching active subcategories separately only for the uncategorized case.
      const clsRes = await apiFetch('/subcategories');
      if (!clsRes.ok) throw new Error('Failed to fetch sub-categories');
      const { categories: activeCategoryed } = await clsRes.json();
      const uncategorizedCategory = activeCategoryed.find(g => g.id === 0);

      categories = allCategories.map(g => ({
        ...g,
        // subcategories already include bookmarkCount from the categories endpoint
        subcategories: g.subcategories || [],
      }));

      if (uncategorizedCategory && uncategorizedCategory.subcategories.length > 0) {
        categories.push({
          id: 0,
          name: 'Uncategorized',
          order: 999,
          archivedAt: null,
          subcategories: uncategorizedCategory.subcategories,
        });
      }

      renderCategories();
      document.getElementById('add-category-section').style.display = viewMode === 'active' ? 'flex' : 'none';

    } catch (e) {
      document.getElementById('categories-container').innerHTML =
        `<div class="state-box">⚠️ Failed to load categories.<br><small>${esc(e.message)}</small></div>`;
      console.error(e);
    }
  }

  // ── Render ─────────────────────────────────────────────────────────────────
  function renderCategories() {
    const container = document.getElementById('categories-container');

    const visible = viewMode === 'archived'
      ? categories.filter(g => g.archivedAt || g.subcategories.some(c => c.archivedAt))
      : categories.filter(g => !g.archivedAt);

    if (visible.length === 0) {
      container.innerHTML = viewMode === 'archived'
        ? '<div class="state-box">📭 No archived categories.</div>'
        : '<div class="state-box">📂 No categories yet. Add one below.</div>';
      return;
    }

    container.innerHTML = visible.map((g, idx) => renderCategoryCard(g, idx, visible)).join('');
  }

  function renderCategoryCard(g, idx, allVisible) {
    const isVirtual = g.id === 0; // uncategorized pseudo-category
    const isArchived = !!g.archivedAt;

    const orderControls = !isVirtual ? `
      <div class="order-controls">
        <button class="btn-order" title="Move up"
          ${idx === 0 ? 'disabled' : ''}
          onclick="reorderCategory(${g.id}, ${g.order - 1}, event)">▲</button>
        <button class="btn-order" title="Move down"
          ${idx === allVisible.length - 1 ? 'disabled' : ''}
          onclick="reorderCategory(${g.id}, ${g.order + 1}, event)">▼</button>
      </div>` : '';

    const nameSection = `
      <div class="category-name-wrap">
        <span class="category-name">${esc(g.name)}</span>
        ${g.description ? `<span class="category-desc">${esc(g.description)}</span>` : ''}
      </div>`;

    const archivedBadge = isArchived ? `<span class="badge-archived">ARCHIVED</span>` : '';

    let actionBtns = '';
    if (!isVirtual) {
      if (isArchived) {
        actionBtns = `<button class="btn-icon success" onclick="restoreCategory(${g.id}, event)">↩ Restore</button>`;
      } else {
        actionBtns = `
          <button class="btn-icon" onclick="startRenameCategory(${g.id}, event)">Rename</button>
          <button class="btn-icon danger" onclick="archiveCategory(${g.id}, event)">Archive</button>`;
      }
    }

    // Sub-categories within this category
    const visibleClasses = viewMode === 'archived'
      ? g.subcategories.filter(c => c.archivedAt)
      : g.subcategories.filter(c => !c.archivedAt);

    const classRows = visibleClasses.map((c, ci) => renderSubcategoryRow(c, ci, visibleClasses)).join('');

    const addClassRow = (!isArchived && viewMode === 'active') ? `
      <div class="add-subcategory-row">
        <div class="add-class-inputs">
          <input class="add-input" type="text" placeholder="New sub-category…" maxlength="255"
                 data-category-id="${g.id}"
                 onkeydown="if(event.key==='Enter') addSubcategory(${g.id}, this)" />
          <button class="btn-add" onclick="addSubcategory(${g.id}, this.closest('.add-subcategory-row').querySelector('.add-input'))">+ Add</button>
        </div>
        <textarea class="add-desc-input" rows="1" placeholder="Description (optional)…" maxlength="1000"
                  data-desc-for="${g.id}"></textarea>
      </div>` : '';

    return `
    <div class="category-card ${isArchived ? 'archived-row' : ''}" data-category-id="${g.id}">
      <div class="category-header" id="category-header-${g.id}">
        ${orderControls}
        ${nameSection}
        ${archivedBadge}
        ${actionBtns}
      </div>
      <div class="subcategory-list">
        ${classRows || (viewMode === 'archived' ? '' : '<div style="color:var(--text-muted);font-size:12px;padding:4px 0">No sub-categories yet.</div>')}
        ${addClassRow}
      </div>
    </div>`;
  }

  function renderSubcategoryRow(c, idx, allVisible) {
    const isArchived = !!c.archivedAt;
    const orderControls = `
      <div class="order-controls">
        <button class="btn-order" title="Move up"
          ${idx === 0 ? 'disabled' : ''}
          onclick="reorderSubcategory(${c.id}, ${c.order - 1}, event)">▲</button>
        <button class="btn-order" title="Move down"
          ${idx === allVisible.length - 1 ? 'disabled' : ''}
          onclick="reorderSubcategory(${c.id}, ${c.order + 1}, event)">▼</button>
      </div>`;

    const archivedBadge = isArchived ? `<span class="badge-archived">ARCHIVED</span>` : '';

    const count = c.bookmarkCount ?? 0;
    const countBadge = `<span class="count-badge" title="${count} active bookmark${count === 1 ? '' : 's'}">${count}</span>`;

    let actionBtns = '';
    if (isArchived) {
      actionBtns = `<button class="btn-icon success" onclick="restoreSubcategory(${c.id}, event)">↩ Restore</button>`;
    } else {
      actionBtns = `
        <button class="btn-icon" onclick="startRenameSubcategory(${c.id}, event)">Rename</button>
        <button class="btn-icon danger" onclick="archiveSubcategory(${c.id}, event)">Archive</button>`;
    }

    const visibleChildren = viewMode === 'archived'
      ? (c.subSubcategories || []).filter(item => item.archivedAt)
      : (c.subSubcategories || []).filter(item => !item.archivedAt);

    const childRows = visibleChildren.map((item, childIdx) => renderSubSubcategoryRow(item, childIdx, visibleChildren)).join('');

    const addChildRow = (!isArchived && viewMode === 'active') ? `
      <div class="add-subcategory-row" style="margin-left:28px;margin-top:8px;">
        <div class="add-class-inputs">
          <input class="add-input" type="text" placeholder="New sub-sub-category…" maxlength="255"
                 data-subcategory-id="${c.id}"
                 onkeydown="if(event.key==='Enter') addSubSubcategory(${c.id}, this)" />
          <button class="btn-add" onclick="addSubSubcategory(${c.id}, this.closest('.add-subcategory-row').querySelector('.add-input'))">+ Add</button>
        </div>
        <textarea class="add-desc-input" rows="1" placeholder="Description (optional)…" maxlength="1000"></textarea>
      </div>` : '';

    return `
    <div class="subcategory-row ${isArchived ? 'archived-row' : ''}" data-class-id="${c.id}" id="subcategory-row-${c.id}">
      ${orderControls}
      <div class="subcategory-name-wrap">
        <span class="subcategory-name">${esc(c.name)}</span>
        ${c.description ? `<span class="subcategory-desc">${esc(c.description)}</span>` : ''}
      </div>
      ${countBadge}
      ${archivedBadge}
      ${actionBtns}
    </div>
    ${childRows ? `<div style="margin-left:28px;border-left:1px solid var(--border);padding-left:12px;">${childRows}</div>` : ''}
    ${addChildRow}`;
  }

  function renderSubSubcategoryRow(c, idx, allVisible) {
    const isArchived = !!c.archivedAt;
    const orderControls = `
      <div class="order-controls">
        <button class="btn-order" title="Move up"
          ${idx === 0 ? 'disabled' : ''}
          onclick="reorderSubSubcategory(${c.id}, ${c.order - 1}, event)">▲</button>
        <button class="btn-order" title="Move down"
          ${idx === allVisible.length - 1 ? 'disabled' : ''}
          onclick="reorderSubSubcategory(${c.id}, ${c.order + 1}, event)">▼</button>
      </div>`;

    const archivedBadge = isArchived ? `<span class="badge-archived">ARCHIVED</span>` : '';
    const count = c.bookmarkCount ?? 0;
    const countBadge = `<span class="count-badge" title="${count} active bookmark${count === 1 ? '' : 's'}">${count}</span>`;
    const actionBtns = isArchived
      ? `<button class="btn-icon success" onclick="restoreSubSubcategory(${c.id}, event)">↩ Restore</button>`
      : `<button class="btn-icon" onclick="startRenameSubSubcategory(${c.id}, event)">Rename</button><button class="btn-icon danger" onclick="archiveSubSubcategory(${c.id}, event)">Archive</button>`;

    return `
    <div class="subcategory-row ${isArchived ? 'archived-row' : ''}" data-sub-sub-id="${c.id}" id="sub-subcategory-row-${c.id}" style="background:rgba(255,255,255,0.02);margin-top:6px;">
      ${orderControls}
      <div class="subcategory-name-wrap">
        <span class="subcategory-name">${esc(c.name)}</span>

  // ── Add Category ──────────────────────────────────────────────────────────────
  async function addCategory() {
    const input = document.getElementById('add-category-input');
    const descInput = document.getElementById('add-category-desc');
    const name = input.value.trim();
    if (!name) return;
    const description = descInput ? descInput.value.trim() : '';
    const btn = document.getElementById('btn-add-category');
    btn.disabled = true;
    try {
      const maxOrder = categories.reduce((m, g) => Math.max(m, g.order ?? 0), 0);
      const body = { name, order: maxOrder + 1 };
      if (description) body.description = description;
      const res = await apiFetch('/categories', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
      });
      const data = await res.json();
      if (!res.ok) { toast(data.error || 'Failed to add category', 'error'); return; }
      input.value = '';
      if (descInput) descInput.value = '';
      toast(`Category "${name}" created`, 'ok');
      await loadAll();
    } catch (e) {
      toast(e.message, 'error');
    } finally {
      btn.disabled = false;
    }
  }

  // ── Rename Category ───────────────────────────────────────────────────────────
  function startRenameCategory(categoryId, e) {
    e.stopPropagation();
    const header = document.getElementById(`category-header-${categoryId}`);
    const nameWrap = header.querySelector('.category-name-wrap');
    const nameSpan = nameWrap.querySelector('.category-name');
    const descSpan = nameWrap.querySelector('.category-desc');
    const currentName = nameSpan.textContent;
    const currentDesc = descSpan ? descSpan.textContent : '';

    // Build inline edit container replacing the name-wrap
    const editWrap = document.createElement('div');
    editWrap.style.flex = '1';
    editWrap.style.display = 'flex';
    editWrap.style.flexDirection = 'column';
    editWrap.style.gap = '4px';

    const inp = document.createElement('input');
    inp.className = 'inline-input';
    inp.value = currentName;
    inp.maxLength = 255;

    const descInp = document.createElement('textarea');
    descInp.className = 'inline-desc-input';
    descInp.value = currentDesc;
    descInp.maxLength = 1000;
    descInp.rows = 2;
    descInp.placeholder = 'Description (optional)…';

    editWrap.appendChild(inp);
    editWrap.appendChild(descInp);
    nameWrap.replaceWith(editWrap);

    const saveBtn = document.createElement('button');
    saveBtn.className = 'btn-icon confirm';
    saveBtn.textContent = 'Save';
    const cancelBtn = document.createElement('button');
    cancelBtn.className = 'btn-icon cancel';
    cancelBtn.textContent = 'Cancel';

    // Remove existing action buttons (Rename, Archive)
    const existingBtns = header.querySelectorAll('.btn-icon');
    existingBtns.forEach(b => b.remove());
    header.appendChild(saveBtn);
    header.appendChild(cancelBtn);

    inp.focus();
    inp.select();

    saveBtn.onclick = () => commitRenameCategory(categoryId, inp.value, descInp.value);
    cancelBtn.onclick = () => renderCategories();
    inp.onkeydown = (ev) => {
      if (ev.key === 'Enter') { ev.preventDefault(); commitRenameCategory(categoryId, inp.value, descInp.value); }
      if (ev.key === 'Escape') renderCategories();
    };
  }

  // ── Toast ──────────────────────────────────────────────────────────────────
  let toastTimer = null;
  function toast(msg, type = 'ok') {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.className = `show ${type}`;
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { el.className = ''; }, 3000);
  }

  // ── Helpers ────────────────────────────────────────────────────────────────
  function esc(str) {
    if (!str) return '';
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }
