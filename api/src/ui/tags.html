<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tag Management - Bookmark Manager</title>
  <script src="/ui/theme-init.js"></script>
  <link rel="stylesheet" href="/ui/theme.css" />
  <link rel="stylesheet" href="/ui/tags.css" />
</head>
<body>
  <div id="topbar">
    <a href="/app" class="back-link">&lt; Back to bookmarks</a>
    <h1>Tag Management</h1>
    <div id="archive-toggle">
      <button class="toggle-btn active" id="btn-active" data-action="setView" data-arg="active">Active</button>
      <button class="toggle-btn" id="btn-archived" data-action="setView" data-arg="archived">Archived</button>
    </div>
    <button type="button" class="theme-toggle" data-theme-toggle title="Switch to the light theme" aria-label="Switch to the light theme">☀</button>
    <button class="nav-btn" data-action="logout" title="End this browser session">Log out</button>
  </div>

  <div id="page">
    <div id="add-tag-section">
      <input id="add-tag-input" type="text" placeholder="New tag name..." maxlength="255" data-enter="addTag" />
      <button id="btn-add-tag" data-action="addTag">+ Add Tag</button>
    </div>

    <div id="tags-container">
      <div class="state-box">Loading...</div>
    </div>
  </div>

  <div id="toast"></div>

  <footer>
    © 2026 UncleJS — Licensed under <a href="https://www.gnu.org/licenses/agpl-3.0.txt" target="_blank" rel="noopener noreferrer">AGPL-3.0-or-later</a>
  </footer>

<script src="/ui/common.js"></script>
<script src="/ui/tags.js"></script>
</body>
</html>
